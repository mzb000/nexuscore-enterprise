apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: order-service-latency-injection
  namespace: nexuscore
spec:
  action: delay
  mode: fixed
  value: "2" # inject into 2 pods
  selector:
    namespaces:
      - nexuscore
    labelSelectors:
      app: order-service
  delay:
    latency: "250ms"
    jitter: "50ms"
    correlation: "50"
  duration: "5m"
  direction: to
  target:
    mode: all
    selector:
      namespaces:
        - nexuscore
      labelSelectors:
        app: payment-service
