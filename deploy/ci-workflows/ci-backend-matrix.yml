name: Backend Polyglot CI Matrix

on:
  push:
    branches: [main, master]
    paths:
      - 'services/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'services/**'

jobs:
  test-identity-node:
    name: Test Identity Service (Node.js/NestJS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: services/identity-service/package.json
      - name: Install & Test
        working-directory: services/identity-service
        run: |
          npm ci
          npx prisma generate
          npm run test --if-present

  test-order-go:
    name: Test Order Service (Go 1.23)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: services/order-service/go.mod
      - name: Build & Test
        working-directory: services/order-service
        run: |
          go vet ./...
          go test -race -covermode=atomic ./...

  test-catalog-python:
    name: Test Catalog Service (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install & Lint
        working-directory: services/catalog-service
        run: |
          pip install --upgrade pip
          pip install -e .
          python -m compileall src

  test-payment-java:
    name: Test Payment Service (Java 21/Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Maven Verify
        working-directory: services/payment-service
        run: |
          mvn clean test -DskipTests=false
