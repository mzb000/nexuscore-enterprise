apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nexuscore-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/nexuscore/nexuscore-enterprise.git
    targetRevision: HEAD
    path: deploy/k8s/base
  destination:
    server: https://kubernetes.default.svc
    namespace: nexuscore
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
