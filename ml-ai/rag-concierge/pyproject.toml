[project]
name = "nexuscore-rag-concierge"
version = "1.0.0"
description = "NexusCore AI Concierge with LangGraph, Hybrid RAG, Vector Search, and Guardrails"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.5",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.1",
    "langchain>=0.3.7",
    "langgraph>=0.2.45",
    "langchain-core>=0.3.15",
    "numpy>=1.26.4",
    "sentence-transformers>=3.3.1",
    "qdrant-client>=1.12.0",
    "httpx>=0.27.2",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
