[package]
name = "settlement-engine-rust"
version = "1.0.0"
edition = "2021"
authors = ["NexusCore Architecture Team"]
description = "Ultra-low-latency financial settlement and cryptographic transaction ledger in Rust"

[dependencies]
tokio = { version = "1.41.1", features = ["full"] }
axum = { version = "0.7.7", features = ["json"] }
serde = { version = "1.0.214", features = ["derive"] }
serde_json = "1.0.132"
uuid = { version = "1.11.0", features = ["v4", "serde"] }
chrono = { version = "0.4.38", features = ["serde"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
sha2 = "0.10.8"
hex = "0.4.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
