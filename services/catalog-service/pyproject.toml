[project]
name = "nexuscore-catalog-service"
version = "1.0.0"
description = "NexusCore Enterprise Catalog & Search Service with FastAPI, GraphQL, MongoDB, and Elasticsearch"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.5",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.1",
    "motor>=3.6.0",
    "elasticsearch[async]>=8.15.1",
    "strawberry-graphql[fastapi]>=0.248.1",
    "orjson>=3.10.11",
    "httpx>=0.27.2",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.4",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
